<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loop Player</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <p class="eyebrow">TIKTOK SOUNDS</p>
        <h1>Loop Player</h1>
        <p class="subtitle">Save your favorite sounds and keep the best part on repeat.</p>
      </header>

      <section class="empty-state" aria-label="Saved sounds">
        <div class="empty-icon" aria-hidden="true">♪</div>
        <h2>No sounds yet</h2>
        <p>Tap the plus button to add a TikTok sound.</p>
      </section>

      <button class="add-button" id="open-dialog" type="button" aria-label="Add a TikTok URL">
        <span aria-hidden="true">+</span>
      </button>
    </main>

    <dialog class="add-dialog" id="add-dialog" aria-labelledby="dialog-title">
      <form id="url-form" method="post">
        <button class="close-button" id="close-dialog" type="button" aria-label="Close">×</button>
        <p class="eyebrow">NEW SOUND</p>
        <h2 id="dialog-title">Add a TikTok URL</h2>
        <label for="tiktok-url">TikTok URL</label>
        <input
          id="tiktok-url"
          name="url"
          type="url"
          placeholder="https://tiktok.com/..."
          autocomplete="off"
          required
        >
        <p class="hint">Use a URL starting with https://tiktok.com/</p>
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <button class="submit-button" type="submit">Add sound</button>
      </form>
    </dialog>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
