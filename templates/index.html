<!doctype html>
<html lang="en">
  <head>
    <!-- Tell the browser how to display text and fit the page to a phone screen. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Set the name shown on the browser tab. -->
    <title>Loop Player</title>
    <!-- Load the file that controls the page's colors, spacing, and layout. -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="header-row">
          <div class="header-actions">
            <!-- Open the song search bar. -->
            <button class="icon-button" id="search-button" type="button" aria-label="Search saved sounds">
              <svg class="top-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="10.8" cy="10.8" r="5.8"></circle>
                <path d="m15.2 15.2 4.3 4.3"></path>
              </svg>
            </button>
            <!-- Turn on rename controls for saved sounds. -->
            <button class="icon-button" id="edit-button" type="button" aria-label="Rename saved sounds">
              <svg class="top-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m4 16.8-.8 3.8 3.8-.8L18.7 8.1a2.7 2.7 0 0 0-3.8-3.8L4 16.8Z"></path>
                <path d="m13.7 5.3 5 5"></path>
              </svg>
            </button>
            <!-- Turn on delete controls for saved sounds. -->
            <button class="icon-button" id="delete-button" type="button" aria-label="Delete saved sounds">
              <svg class="top-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4.5 7.5h15M9 7.5V5h6v2.5M7 7.5l.8 12h8.4l.8-12M10 11v5.5M14 11v5.5"></path>
              </svg>
            </button>
          </div>
        </div>
        <!-- Search saved songs by name. -->
        <div class="search-row" id="search-row">
          <input id="search-input" type="search" placeholder="Search songs..." autocomplete="off">
          <button id="clear-search" type="button" aria-label="Cancel search">Cancel</button>
        </div>
      </header>

      {% if tracks %}
      <!-- Show every MP3 that has already been saved. -->
      <section class="track-list" aria-label="Saved sounds">
        {% for track in tracks %}
        <article class="track-card" data-title="{{ track.title|lower }}">
          <!-- Play or stop this sound from the black square. -->
          <button class="play-button" type="button" aria-label="Play {{ track.title }}">
            <span class="play-icon" aria-hidden="true"></span>
          </button>
          <div class="track-details">
            <h2>{{ track.title }}</h2>
            <!-- Rename this sound while edit mode is active. -->
            <form class="rename-form" method="post">
              <input type="hidden" name="filename" value="{{ track.filename }}">
              <input name="name" type="text" value="{{ track.title }}" maxlength="100" required>
              <button type="submit">Save</button>
            </form>
            <!-- Delete this sound while delete mode is active. -->
            <button class="delete-track-button" type="button" data-filename="{{ track.filename }}">Delete</button>
            <!-- Show the sound length without browser audio controls. -->
            <p class="track-duration" data-duration>--:--</p>
            <audio class="audio-player" loop preload="metadata" src="{{ url_for('audio', filename=track.filename) }}"></audio>
          </div>
        </article>
        {% endfor %}
      </section>
      <!-- Show this when a search has no matching songs. -->
      <p class="search-empty" id="search-empty" hidden>No matching songs.</p>
      {% else %}
      <!-- Show a message before the first sound is saved. -->
      <section class="empty-state" aria-label="Saved sounds">
        <!-- Show a music note icon while there are no saved sounds. -->
        <div class="empty-icon" aria-hidden="true">♪</div>
        <!-- Tell the user that no sounds have been added yet. -->
        <h2>No sounds yet</h2>
        <!-- Tell the user how to begin adding a sound. -->
        <p>Tap the plus button to add a TikTok sound.</p>
      </section>
      {% endif %}

      <!-- Open the box for adding a sound from the bottom-right corner. -->
      <button class="add-button" id="open-dialog" type="button" aria-label="Add a TikTok URL">
        <svg class="top-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14M5 12h14"></path>
        </svg>
      </button>
    </main>

    <!-- Show the box where the user enters a TikTok address. -->
    <dialog class="add-dialog" id="add-dialog" aria-labelledby="dialog-title">
      <form id="url-form" method="post">
        <!-- Show the button that closes the address box. -->
        <button class="close-button" id="close-dialog" type="button" aria-label="Close">×</button>
        <!-- Label the box as a place to add a new sound. -->
        <p class="eyebrow">NEW SOUND</p>
        <!-- Show the title inside the address box. -->
        <h2 id="dialog-title">Add a TikTok URL</h2>
        <!-- Ask the user what to call the saved audio. -->
        <label for="audio-name">Audio name</label>
        <input id="audio-name" name="name" type="text" placeholder="e.g. Dance practice" maxlength="100" autocomplete="off" required>
        <!-- Tell the user what information to enter. -->
        <label for="tiktok-url">TikTok URL</label>
        <!-- Give the user a place to paste the TikTok address. -->
        <input
          id="tiktok-url"
          name="url"
          type="url"
          placeholder="https://tiktok.com/..."
          autocomplete="off"
          required
        >
        <!-- Remind the user which kind of address is accepted. -->
        <p class="hint">Use a URL starting with https://tiktok.com/</p>
        <!-- Show the success or error message after checking the address. -->
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <!-- Show the button that sends the address for checking. -->
        <button class="submit-button" type="submit">Add sound</button>
      </form>
    </dialog>

    <!-- Load the file that makes the buttons and address box respond to clicks. -->
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
